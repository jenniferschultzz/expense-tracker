services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/expenses
      DB_USER: app
      DB_PASSWORD: secret
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
